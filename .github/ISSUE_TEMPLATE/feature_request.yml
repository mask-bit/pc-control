name: Feature request
description: Sugira uma melhoria
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Objetivo
      description: Que problema essa melhoria resolve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Solucao sugerida
      description: Descreva o comportamento esperado.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat IA
        - Login Google
        - IA e creditos
        - Executor protegido
        - Spotify
        - Rotinas
        - UI
        - Build Tauri
