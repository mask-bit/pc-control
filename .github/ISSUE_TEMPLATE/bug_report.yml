name: Bug report
description: Reporte um problema no PC Control AI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Passos, pedido no chat e resultado obtido.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: Windows 11 24H2
  - type: input
    id: app_version
    attributes:
      label: Versao do app
      placeholder: 0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Logs sem dados sensiveis
      render: text
